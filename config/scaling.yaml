# One independent Optuna study is run for every model-size/FLOP pair below.
training_config: sweep
output_dir: /data/picoformer/outputs/scaling
nproc_per_node: 2
# Initial per-device batch. Failed runs retry with 16, 8, 4, 2, then 1 while
# preserving the sampled global batch size through gradient accumulation.
local_batch_size: 2
n_trials: 40
seed: 42
near_optimal_relative_margin: 0.0025
weight_decay: 0.1

search_space:
  learning_rate: [1.0e-3, 2.5e-3, 5.0e-3, 7.5e-3, 1.0e-2, 2e-2]
  global_batch_size: [4, 8, 16]

# FLOP targets are crossed with every model size. The training token count is
# calculated as D = C / (6N), rounded to the nearest whole token.
compute_flops: [1e17]

# num_parameters is the explicit, auditable N used in C = 6ND. Update it with
# the exact trainable parameter count when changing an architecture.
model_sizes:
  - name: qwen3_5_135m
    num_parameters: 135136414
    architecture: {hidden_size: 576, intermediate_size: 1152, num_hidden_layers: 30}
